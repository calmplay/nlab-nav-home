    <script>
      (function(){
        var c=document.cookie.match(/clash_machine=(\d+)/);
        var p=new URLSearchParams(location.search);
        var m=p.get('machine')||(c?c[1]:null);
        if(m){document.cookie='clash_machine='+m+';path=/;max-age=86400;SameSite=Lax'}
        document.getElementById('machine-label').textContent=m?'dx'+m+' 号机':'未选择';
        document.getElementById('reset-btn').onclick=function(){
          document.cookie.split(';').forEach(function(c){document.cookie=c.replace(/^ +/,'').replace(/=.*/,'=;path=/;max-age=0')});
          for(var k in localStorage){if(k.startsWith('nlab.clash.secret.'))localStorage.removeItem(k)}
