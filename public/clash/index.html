<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231a1b26'/><text x='50' y='70' font-size='60' text-anchor='middle' fill='%237c3aed' font-weight='bold'>C</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="theme-color" content="#f4f5f6" />
    <meta name="description" content="Clash web port" />
    <title>Clash</title>
    <script type="module" crossorigin src="./assets/index-5e90ca00.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/vendor-827b5617.js">
    <link rel="stylesheet" href="./assets/index-6d88662b.css">
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <div style="position:fixed;bottom:132px;left:35px;z-index:2147483647;display:flex;flex-direction:column;gap:6px;text-align:center">
      <span id="machine-label" style="padding:6px 16px;background:rgba(69,131,216,0.15);color:#4583D8;border:1px solid #4583D8;border-radius:6px;font-size:13px">加载中</span>
      <button id="back-home" style="padding:6px 16px;background:#4583D8;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:13px">返回主页</button>
      <button id="reset-btn" title="仅清除当前机器保存的 Clash secret，不影响其他机器" style="padding:6px 16px;background:#4583D8;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:13px">重置当前</button>
    </div>
    <script>
      (function(){
        var c=document.cookie.match(/clash_machine=(\d+)/);
        var curMachine = c ? c[1] : null;
        document.getElementById('machine-label').textContent = curMachine ? 'dx'+curMachine+' 号机' : '未选择';

        document.getElementById('back-home').onclick = function(){
          location.href = '/';
        };

        // 只重置当前机器，不误伤其他机器
        document.getElementById('reset-btn').onclick = function(){
          document.cookie = 'clash_machine=;path=/;max-age=0;SameSite=Lax';
          if (curMachine) {
            localStorage.removeItem('nlab.clash.secret.dx' + curMachine);
          }
          localStorage.removeItem('externalControllers');
          localStorage.removeItem('externalControllerIndex');
          location.href = '/';
        };

        // logo fallback：隐藏破图，插入文字
        function fixBrokenLogo() {
          var imgs = document.querySelectorAll('img');
          for (var i = 0; i < imgs.length; i++) {
            var img = imgs[i];
            if (img.complete && img.naturalWidth === 0 && img.naturalHeight === 0) {
              var fallback = document.createElement('span');
              fallback.textContent = 'NLab Clash';
              fallback.style.cssText = 'font-size:18px;font-weight:700;color:#4583D8;padding:4px 8px';
              img.replaceWith(fallback);
            }
          }
        }
        window.addEventListener('load', function(){ fixBrokenLogo(); setTimeout(fixBrokenLogo, 600); setTimeout(fixBrokenLogo, 1800); });
      })();
    </script>
  </body>
</html>
