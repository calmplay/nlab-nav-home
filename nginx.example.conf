# nlab-nav-preview.conf —— NLab 服务网关（1105 端口）
#
# 部署位置：/home/cy/docker_vol/nginx/conf/conf.d/nlab-nav-preview.conf
# 此文件为脱敏示例；认证、上游密钥和实际主机配置仅保留在生产服务器。

server {
    listen 1105;
    server_name _;

    # 网关认证由本机 sidecar 完成；所有公开路径均先过认证。
    location = /__nav_auth/check { proxy_pass http://127.0.0.1:<auth-port>/check; }
    location /__nav_auth/ { proxy_pass http://127.0.0.1:<auth-port>/; }

    # 导航主页与内置 Clash Dashboard。
    location / {
        root /usr/share/nginx/html/lab-nav-preview;
        try_files $uri $uri/ /index.html;
    }
    location /clash/ {
        root /usr/share/nginx/html/lab-nav-preview;
        try_files $uri $uri/ /clash/index.html;
    }

    # 已迁移服务：均由 1105 直接反向代理。
    location ^~ /qw/ { proxy_pass http://<qwen-backend>/; }
    location /svc/prometheus/ { proxy_pass http://127.0.0.1:9090/; }
    location /svc/grafana/ { proxy_pass http://127.0.0.1:3000; }
    location ~ ^/(proxies|configs|rules|connections|providers|logs|traffic|memory|group|version|cache)(/.*)?$ {
        proxy_pass http://$clash_backend$request_uri;
    }

    # 暂未完成子路径迁移的设备仍由 1105 跳转到其保留入口。
    location /svc/router/ { return 302 http://<gateway-host>:50000/html/index.html#/home; }
    location /svc/ilo/ { return 302 https://<gateway-host>:50009/; }
}
