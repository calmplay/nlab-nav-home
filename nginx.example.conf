# ══════════════════════════════════════════════════════════════
# nlab-nav.conf —— NLab 实验室服务总导航（1104 端口）
#
# 部署位置：/home/cy/docker_vol/nginx/conf/conf.d/nlab-nav.conf
# 容器内路径：/etc/nginx/conf.d/nlab-nav.conf
#
# 注意：此文件是示例，不含内网 IP、密码等敏感信息。
#       生产环境的真实配置在服务器上维护。
# ══════════════════════════════════════════════════════════════

server {
    listen 1104;
    server_name _;

    # ── 总导航主页 ──
    location / {
        root /usr/share/nginx/html/lab-nav;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # ── 前端静态资源（JS / CSS / favicon）──
    location /assets/ {
        root /usr/share/nginx/html/lab-nav;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location = /favicon.svg {
        root /usr/share/nginx/html/lab-nav;
    }

    # ══════════════════════════════════════════════════════════
    # /jump/ —— 302 跳转到原端口（服务不支持子路径反代时使用）
    # ══════════════════════════════════════════════════════════

    # Clash 代理管理 → 旧 17900 网关
    location = /jump/clash/ {
        return 302 http://nuist.cfushn.com:17900/;
    }

    # Syncthing 文件同步
    location = /jump/syncthing-0/ {
        return 302 http://nuist.cfushn.com:50500/;
    }
    location = /jump/syncthing-1/ {
        return 302 http://nuist.cfushn.com:50501/;
    }
    location = /jump/syncthing-2/ {
        return 302 http://nuist.cfushn.com:50502/;
    }
    location = /jump/syncthing-3/ {
        return 302 http://nuist.cfushn.com:50503/;
    }
    location = /jump/syncthing-5/ {
        return 302 http://nuist.cfushn.com:50505/;
    }
    location = /jump/syncthing-8/ {
        return 302 http://nuist.cfushn.com:50508/;
    }

    # ══════════════════════════════════════════════════════════
    # /svc/ —— 反向代理（第四阶段逐个接入，当前预留）
    # ══════════════════════════════════════════════════════════

    # 以下服务待第四阶段验证后启用：
    # - /svc/router/    → 华为路由器管理
    # - /svc/ilo/       → HPE iLO 5 远程管理
    # - /svc/grafana/   → Grafana 监控面板
    # - /svc/prometheus/ → Prometheus 时序数据库
}
